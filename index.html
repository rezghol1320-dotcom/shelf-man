<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>شلف من پیشرفته</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding:14px}h1{text-align:center;margin:8px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}button,input,select{font:inherit;border-radius:10px;padding:11px;margin:3px;border:1px solid #ddd}button{background:#111827;color:#fff;border:0}.primary{width:100%;font-size:18px;background:#2563eb}.danger{background:#b91c1c}.tabs{display:flex;gap:5px;overflow:auto}.tabs button{white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}.stat{background:#eef2ff;border-radius:12px;padding:10px}.cat{font-size:18px;font-weight:bold;margin:14px 0 5px}.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.item input{width:23px;height:23px}.small{font-size:12px;color:#6b7280}.hidden{display:none}#reader{margin-top:10px}.bar{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}.search{width:100%}
</style></head><body><h1>📦 شلف من</h1>
<div class="card"><div class="stats"><div class="stat"><b id="done">0</b><div>انجام شده</div></div><div class="stat"><b id="total">0</b><div>کل کالا</div></div><div class="stat"><b id="percent">0%</b><div>پیشرفت</div></div></div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div class="card"><button class="primary" onclick="scan()">📷 اسکن بارکد</button><div id="reader" class="hidden"></div></div>
<div class="card"><input id="name" placeholder="نام کالا"><select id="cat"><option>چیپس</option><option>پفک و اسنک</option><option>پاپ‌کورن و تنقلات</option><option>کلوچه و بیسکویت</option><option>کیک</option></select><input id="code" placeholder="بارکد"><button onclick="add()">➕ افزودن کالا</button></div>
<div class="card"><input id="search" class="search" placeholder="🔎 جستجوی نام یا بارکد" oninput="render()"><div class="tabs"><button onclick="filter='all';render()">همه</button><button onclick="filter='unchecked';render()">⬜ بررسی‌نشده</button><button onclick="filter='checked';render()">✅ انجام‌شده</button></div><div id="list"></div><button onclick="resetToday()">پاک کردن تیک‌های امروز</button></div>
<script src="https://unpkg.com/html5-qrcode" defer></script><script>
const KEY='shelfAdvancedV1',DAY=()=>new Date().toISOString().slice(0,10);let filter='all',items=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}function add(n,cat,code){n=n??nameEl().value.trim();cat=cat??document.getElementById('cat').value;code=code??document.getElementById('code').value.trim();if(!n)return alert('نام کالا را وارد کن');if(code&&items.some(x=>x.code===code))return alert('این بارکد قبلاً ثبت شده');items.push({id:Date.now(),name:n,cat,code,checked:false,date:''});document.getElementById('name').value='';document.getElementById('code').value='';save()}function nameEl(){return document.getElementById('name')}
function toggle(id){let x=items.find(a=>a.id===id);if(x){x.checked=!x.checked;x.date=x.checked?DAY():'';save()}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),root=document.getElementById('list');root.innerHTML='';let visible=items.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.code.includes(q))&&(filter==='all'||(filter==='checked'?x.checked&&x.date===DAY():!x.checked||x.date!==DAY())));let cats=['چیپس','پفک و اسنک','پاپ‌کورن و تنقلات','کلوچه و بیسکویت','کیک'];cats.forEach(c=>{let a=visible.filter(x=>x.cat===c);if(!a.length)return;let h=document.createElement('div');h.className='cat';h.textContent=c;root.appendChild(h);a.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML='<input type="checkbox" '+(x.checked&&x.date===DAY()?'checked':'')+' onchange="toggle('+x.id+')"><div><b>'+esc(x.name)+'</b><div class="small">'+(x.code?'بارکد: '+esc(x.code):'')+'</div></div>';root.appendChild(d)})});let done=items.filter(x=>x.checked&&x.date===DAY()).length,total=items.length,p=total?Math.round(done/total*100):0;document.getElementById('done').textContent=done;document.getElementById('total').textContent=total;document.getElementById('percent').textContent=p+'%';document.getElementById('fill').style.width=p+'%'}
function resetToday(){items.forEach(x=>{x.checked=false;x.date=''});save()}
async function scan(){let el=document.getElementById('reader');el.classList.remove('hidden');if(!window.Html5Qrcode)return alert('چند ثانیه صبر کن و دوباره بزن');let qr=new Html5Qrcode('reader');try{await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},code=>{let x=items.find(a=>a.code===code);if(x){x.checked=true;x.date=DAY();save();alert('کالا پیدا شد و تیک خورد: '+x.name)}else{let n=prompt('بارکد جدید است. نام کالا را وارد کن:');if(n)add(n,document.getElementById('cat').value,code)}qr.stop().then(()=>el.classList.add('hidden')).catch(()=>{})})}catch(e){el.classList.add('hidden');alert('اجازه دوربین را بده و دوباره امتحان کن')}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
