<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>شلف من</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111827}h1{text-align:center}.box{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ddd;margin:4px}button{background:#111827;color:#fff;border:0}.scan{width:100%;font-size:18px;background:#2563eb}.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.item input{width:22px;height:22px}.actions button{background:#b91c1c;font-size:13px}.cat{font-size:18px;font-weight:bold;margin:15px 0 6px}.small{font-size:12px;color:#6b7280}.hidden{display:none}.stats{text-align:center;font-weight:bold}#reader{margin-top:10px}</style></head><body><h1>📦 شلف من</h1><div class="box stats" id="stats"></div><div class="box"><button class="scan" onclick="scan()">📷 اسکن بارکد</button><div id="reader" class="hidden"></div></div><div class="box"><input id="name" placeholder="نام کالا"><select id="cat"><option>چیپس</option><option>پفک و اسنک</option><option>پاپ‌کورن و تنقلات</option><option>کلوچه و بیسکویت</option><option>کیک</option></select><input id="code" placeholder="بارکد (اختیاری)"><button onclick="add()">➕ افزودن</button></div><div class="box"><input id="search" placeholder="🔎 جستجوی کالا یا بارکد" oninput="render()"><button onclick="togglePending()" id="pendingBtn">فقط بررسی‌نشده‌ها</button><button onclick="resetToday()">پاک کردن تیک‌های امروز</button></div><div class="box"><div id="list"></div></div><script src="https://unpkg.com/html5-qrcode" defer></script><script>
const KEY='shelfItemsFixed1';let items=JSON.parse(localStorage.getItem(KEY)||'[]'),pendingOnly=false;const cats=['چیپس','پفک و اسنک','پاپ‌کورن و تنقلات','کلوچه و بیسکویت','کیک'];const today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}function add(n,cat,code){n=n??nameEl.value.trim();cat=cat??catEl.value;code=code??codeEl.value.trim();if(!n)return alert('نام کالا را وارد کن');if(code&&items.some(x=>x.code===code))return alert('این بارکد قبلاً ثبت شده');items.push({id:Date.now()+Math.random(),name:n,cat,code,checked:false,date:''});nameEl.value='';codeEl.value='';save()}const nameEl=document.getElementById('name'),catEl=document.getElementById('cat'),codeEl=document.getElementById('code');function toggle(id){let x=items.find(a=>a.id==id);if(x){x.checked=!x.checked;x.date=x.checked?today():'';save()}}function removeItem(id){if(!confirm('این کالا حذف شود؟'))return;items=items.filter(x=>x.id!=id);save()}function render(){let q=document.getElementById('search').value.trim().toLowerCase(),root=document.getElementById('list');root.innerHTML='';let visible=items.filter(x=>(!pendingOnly||!(x.checked&&x.date===today()))&&(!q||x.name.toLowerCase().includes(q)||x.code.toLowerCase().includes(q)));let done=items.filter(x=>x.checked&&x.date===today()).length;document.getElementById('stats').textContent=`امروز ${done} از ${items.length} کالا بررسی شده — ${items.length?Math.round(done/items.length*100):0}%`;cats.forEach(cat=>{let a=visible.filter(x=>x.cat===cat);if(!a.length)return;let h=document.createElement('div');h.className='cat';h.textContent=cat;root.appendChild(h);a.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<input type="checkbox" ${x.checked&&x.date===today()?'checked':''} onchange="toggle('${x.id}')"><div style="flex:1"><b>${esc(x.name)}</b><div class="small">${x.code?'بارکد: '+esc(x.code):''}</div></div><div class="actions"><button onclick="removeItem('${x.id}')">🗑️ حذف</button></div>`;root.appendChild(d)})})}function togglePending(){pendingOnly=!pendingOnly;document.getElementById('pendingBtn').textContent=pendingOnly?'نمایش همه کالاها':'فقط بررسی‌نشده‌ها';render()}function resetToday(){items.forEach(x=>{x.checked=false;x.date=''});save()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function scan(){let el=document.getElementById('reader');el.classList.remove('hidden');if(!window.Html5Qrcode)return alert('چند ثانیه صبر کن و دوباره اسکن را بزن');let qr=new Html5Qrcode('reader');try{await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},code=>{let f=items.find(x=>x.code===code);if(f){f.checked=true;f.date=today();save();alert('کالا پیدا شد و تیک خورد: '+f.name)}else{let n=prompt('بارکد جدید است. نام کالا را وارد کن:');if(n)add(n,catEl.value,code)}qr.stop().then(()=>el.classList.add('hidden')).catch(()=>{})})}catch(e){el.classList.add('hidden');alert('اجازه دوربین را بده و دوباره امتحان کن')}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
